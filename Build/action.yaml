name: 'Build with CMake'
description: 'Build project'
inputs:
  compiler:
    description: 'What compiler? (gcc, mingw, msvc)'
    required: true
  shell:
    description: 'The shell to execute steps (bash or msys2)'
    required: false
    default: 'bash'
  install:
    description: 'Create install?'
    required: false
    default: false
  upload_executable:
    description: 'Package and upload standalone executable?'
    required: false
    default: true
  test:
    description: 'Run CTest?'
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Setup Windows MSVC
      if: inputs.compiler == 'msvc'
      shell: ${{ inputs.shell }}
      run: |
        choco install ninja --no-progress

    - name: Setup Windows MSVC part 2
      uses: ilammy/msvc-dev-cmd@v1
      if: inputs.compiler == 'msvc'

    - name: Setup Windows MinGW
      if: inputs.compiler == 'mingw'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        release: false
        location: 'C:\msys64'
        update: true
        install: >
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja

    - name: Configure Release (GCC)
      if: runner.os == 'Linux'
      shell: ${{ inputs.shell }}
      run: |
        EXTRA_ARGS=""
        VCPKG_ROOT_DIR="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
        VCPKG_CMAKE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake"

        if [ -f "$VCPKG_CMAKE" ]; then
          if [ -f "vcpkg.json" ] || [ -d "$VCPKG_ROOT_DIR/installed/x64-linux" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_CMAKE"
          fi
        fi

        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15 $EXTRA_ARGS

    - name: Configure Release (MSVC / MINGW)
      if: runner.os == 'Windows'
      shell: ${{ inputs.shell }}
      run: |
        EXTRA_ARGS=""
        VCPKG_ROOT_DIR="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
        VCPKG_CMAKE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake"

        if [ -f "$VCPKG_CMAKE" ]; then
          if [ -f "vcpkg.json" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_CMAKE"
            if [ "${{ inputs.compiler }}" = "msvc" ]; then
              EXTRA_ARGS="$EXTRA_ARGS -DVCPKG_TARGET_TRIPLET=x64-windows-static"
            fi
          elif [ -d "$VCPKG_ROOT_DIR/installed/x64-windows-static" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_CMAKE -DVCPKG_TARGET_TRIPLET=x64-windows-static"
          elif [ -d "$VCPKG_ROOT_DIR/installed/x64-windows" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_CMAKE"
          fi
        fi

        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $EXTRA_ARGS

    - name: Build
      shell: ${{ inputs.shell }}
      run: cmake --build build --parallel 4

      # Install part:

    - name: Create install (for those that may want a lib pre-installed)
      if: inputs.install
      shell: ${{ inputs.shell }}
      run: cmake --install build --parallel 4 --prefix install

    - name: Archive install for upload
      if: inputs.install
      shell: ${{ inputs.shell }}
      run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
              tar -czf lunaris-${{ runner.os }}-${{ inputs.compiler }}.tar.gz install
          else
              powershell Compress-Archive -Path install\* -DestinationPath lunaris-${{ runner.os }}-${{ inputs.compiler }}.zip
          fi

    - name: Upload install release
      if: inputs.install
      uses: actions/upload-artifact@v7
      with:
        name: lunaris-${{ runner.os }}-${{ inputs.compiler }}
        path: |
          *.tar.gz
          *.zip

    # Standalone / monolith part:

    - name: Stage Executable
      if: inputs.upload_executable == true
      shell: ${{ inputs.shell }}
      run: cmake --install build --prefix dist

    - name: Upload Executable Artifact
      if: inputs.upload_executable == true
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ runner.os }}-${{ inputs.compiler }}
        path: |
          install/bin/*
    
    - name: Test on Windows (Setup audio)
      if: inputs.test && runner.os == 'Windows'
      shell: powershell
      run: |
        Get-CimInstance Win32_SoundDevice | fl *

        # 1. Enable and start Windows Audio services
        Get-Service -Name "Audiosrv", "AudioEndpointBuilder" | Set-Service -StartupType Automatic
        Get-Service -Name "Audiosrv", "AudioEndpointBuilder" | Start-Service

        # 2. Download and extract Scream using native PowerShell Expand-Archive
        Invoke-WebRequest -Uri "https://github.com/duncanthrax/scream/releases/download/4.0/Scream4.0.zip" -OutFile "C:\Scream4.0.zip"
        Expand-Archive -Path "C:\Scream4.0.zip" -DestinationPath "C:\Scream" -Force

        # 3. Locate driver files
        $sysFile = (Get-ChildItem -Path "C:\Scream" -Filter "Scream.sys" -Recurse | Select-Object -First 1).FullName
        $infFile = (Get-ChildItem -Path "C:\Scream" -Filter "Scream.inf" -Recurse | Select-Object -First 1).FullName

        # 4. Import the driver certificate
        $cert = (Get-AuthenticodeSignature $sysFile).SignerCertificate
        $store = [System.Security.Cryptography.X509Certificates.X509Store]::new("TrustedPublisher", "LocalMachine")
        $store.Open("ReadWrite")
        $store.Add($cert)
        $store.Close()

        # 5. Search for pre-installed devcon.exe in Windows SDK on GitHub Runner
        $devcon = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Filter "devcon.exe" -Recurse -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1).FullName

        if ($devcon) {
            Write-Host "Installing via devcon: $devcon"
            & $devcon install $infFile *Scream
        } else {
            Write-Host "devcon.exe not found. Installing via built-in pnputil.exe..."
            pnputil.exe /add-driver $infFile /install
        }

        Get-CimInstance Win32_SoundDevice | fl *

    - name: Test on Windows
      shell: ${{ inputs.shell }}
      if: inputs.test && runner.os == 'Windows'
      run: ctest --test-dir build --output-on-failure --verbose

    - name: Test on Linux
      shell: ${{ inputs.shell }}
      if: inputs.test && runner.os == 'Linux'
      run: |
        sudo apt install -y xvfb # Allow fake display

        # Make sound work
        cat << 'EOF' > ~/.asoundrc
        pcm.!default {
            type dummy
        }
        ctl.!default {
            type dummy
        }
        EOF
        pulseaudio --start --exit-idle-time=-1 || true
        pactl load-module module-null-sink sink_name=dummy || true

        xvfb-run --auto-servernum ctest --test-dir build --output-on-failure --verbose