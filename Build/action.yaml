name: 'Build with CMake'
description: 'Build project'
inputs:
  compiler:
    description: 'What compiler? (gcc, mingw, msvc)'
    required: true
  shell:
    description: 'The shell to execute steps (bash or msys2)'
    required: false
    default: 'bash'
  install:
    description: 'Create install?'
    required: false
    default: false
  upload_executable:
    description: 'Package and upload standalone executable?'
    required: false
    default: true
  test:
    description: 'Run CTest?'
    required: false
    default: true

runs:
  using: composite
  steps:
    - name: Setup Windows MSVC
      if: inputs.compiler == 'msvc'
      shell: ${{ inputs.shell }}
      run: |
        choco install ninja --no-progress

    - name: Setup Windows MSVC part 2
      uses: ilammy/msvc-dev-cmd@v1
      if: inputs.compiler == 'msvc'

    - name: Setup Windows MinGW
      if: inputs.compiler == 'mingw'
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        release: false
        location: 'C:\msys64'
        update: true
        install: >
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja

    - name: Configure Release (GCC)
      if: runner.os == 'Linux'
      shell: ${{ inputs.shell }}
      run: |
        EXTRA_ARGS=""
        VCPKG_ROOT_DIR="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
        VCPKG_CMAKE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake"

        if [ -f "$VCPKG_CMAKE" ]; then
          if [ -f "vcpkg.json" ] || [ -d "$VCPKG_ROOT_DIR/installed/x64-linux" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_CMAKE"
          fi
        fi

        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15 $EXTRA_ARGS

    - name: Configure Release (MSVC / MINGW)
      if: runner.os == 'Windows'
      shell: ${{ inputs.shell }}
      run: |
        EXTRA_ARGS=""
        VCPKG_ROOT_DIR="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
        VCPKG_CMAKE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake"

        if [ -f "$VCPKG_CMAKE" ]; then
          if [ -f "vcpkg.json" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_CMAKE"
            if [ "${{ inputs.compiler }}" = "msvc" ]; then
              EXTRA_ARGS="$EXTRA_ARGS -DVCPKG_TARGET_TRIPLET=x64-windows-static"
            fi
          elif [ -d "$VCPKG_ROOT_DIR/installed/x64-windows-static" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_CMAKE -DVCPKG_TARGET_TRIPLET=x64-windows-static"
          elif [ -d "$VCPKG_ROOT_DIR/installed/x64-windows" ]; then
            EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_CMAKE"
          fi
        fi

        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $EXTRA_ARGS

    - name: Build
      shell: ${{ inputs.shell }}
      run: cmake --build build --parallel 4

      # Install part:

    - name: Create install (for those that may want a lib pre-installed)
      if: inputs.install
      shell: ${{ inputs.shell }}
      run: cmake --install build --parallel 4 --prefix install

    - name: Archive install for upload
      if: inputs.install
      shell: ${{ inputs.shell }}
      run: |
          if [ "$RUNNER_OS" != "Windows" ]; then
              tar -czf lunaris-${{ runner.os }}-${{ inputs.compiler }}.tar.gz install
          else
              powershell Compress-Archive -Path install\* -DestinationPath lunaris-${{ runner.os }}-${{ inputs.compiler }}.zip
          fi

    - name: Upload install release
      if: inputs.install
      uses: actions/upload-artifact@v7
      with:
        name: lunaris-${{ runner.os }}-${{ inputs.compiler }}
        path: |
          *.tar.gz
          *.zip

    # Standalone / monolith part:

    - name: Stage Executable
      if: inputs.upload_executable == true
      shell: ${{ inputs.shell }}
      run: cmake --install build --prefix dist

    - name: Upload Executable Artifact
      if: inputs.upload_executable == true
      uses: actions/upload-artifact@v4
      with:
        name: app-${{ runner.os }}-${{ inputs.compiler }}
        path: |
          install/bin/*
    
    - name: Test on Windows (Setup)
      if: inputs.test && runner.os == 'Windows'
      shell: powershell
      run: |
        Set-Service -Name Audiosrv -StartupType Automatic
        Start-Service -Name Audiosrv
        choco install vb-audio-virtual-cable --no-progress -y

    - name: Test on Windows
      shell: ${{ inputs.shell }}
      if: inputs.test && runner.os == 'Windows'
      run: ctest --test-dir build --output-on-failure --verbose

    - name: Test on Linux
      shell: ${{ inputs.shell }}
      if: inputs.test && runner.os == 'Linux'
      run: |
        sudo apt install -y xvfb # Allow fake display

        # Make sound work
        cat << 'EOF' > ~/.asoundrc
        pcm.!default {
            type dummy
        }
        ctl.!default {
            type dummy
        }
        EOF
        pulseaudio --start --exit-idle-time=-1 || true
        pactl load-module module-null-sink sink_name=dummy || true

        xvfb-run --auto-servernum ctest --test-dir build --output-on-failure --verbose