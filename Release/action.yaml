name: 'Make release of artifacts'
description: 'Downloads artifacts and creates a release from them'

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
          path: _dist
          merge-multiple: true

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: _dist/*
