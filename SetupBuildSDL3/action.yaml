name: 'Install fancy SDL3 and libcurl dependencies here'
description: 'Quick installation to enable build of SDL3 and libcurl with it'

runs:
  using: composite
  steps:
    - name: Setup Windows MSVC packages
      if: runner.os == 'Windows'
      shell: bash
      run: |
        vcpkg install --triplet x64-windows-static \
            zlib \
            brotli \
            nghttp2 \
            zstd \
            libidn2 \
            freetype \
            harfbuzz \
            libpng \
            libwebp \
            tiff \
            libjpeg-turbo
        
    - name: Setup Ubuntu packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt update && \
        sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libjack-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxxf86vm-dev \
            libxss-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libdecor-0-dev \
            liburing-dev \
            libsndio-dev \
            libdbus-1-dev \
            libvulkan-dev \
            libxkbcommon-dev \
            libibus-1.0-dev \
            libusb-1.0-0-dev \
            libxtst-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpng-dev \
            libwebp-dev \
            libtiff-dev \
            libjpeg-dev \
            libidn2-dev \
            libnghttp2-dev \
            libbrotli-dev \
            libzstd-dev \
            zlib1g-dev

    - name: Setup macOS Environment
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install \
            zstd \
            brotli \
            nghttp2 \
            libpsl \
            freetype \
            harfbuzz \
            libpng \
            webp \
            libtiff \
            libidn2 \
            jpeg            

    - name: Configure Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -S . -B build
            -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake
            -DVCPKG_TARGET_TRIPLET=x64-windows-static
            -DCMAKE_BUILD_TYPE=Release

    - name: Build Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake --build build --config Release --verbose

    - name: Build Linux / MacOS
      if: runner.os != 'Windows'
      shell: bash
      run: |
        cmake -S . -B build
        cmake --build build --config Release --verbose

