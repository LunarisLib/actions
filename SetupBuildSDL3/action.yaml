name: 'Install fancy SDL3 and libcurl dependencies here'
description: 'Quick installation to enable build of SDL3 and libcurl with it'

runs:
  using: composite
  steps:

# Setup env things

    - name: Setup Windows MSVC packages
      if: runner.os == 'Windows'
      shell: bash
      run: |
        vcpkg install --triplet x64-windows-static \
            bzip2 \
            libflac \
            zlib \
            brotli \
            nghttp2 \
            zstd \
            libidn2 \
            freetype \
            harfbuzz \
            libpng \
            libwebp \
            tiff \
            libjpeg-turbo \
            libogg \
            libpsl[libicu] \
            libtheora \
            libvorbis \
            minimp3 \
            openal-soft \
            opus \
            opusfile \
            directxsdk

        choco install ninja --no-progress
        
    - name: Setup Windows MSVC
      uses: ilammy/msvc-dev-cmd@v1
      if: runner.os == 'Windows'
        
    - name: Setup Ubuntu packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt update && \
        sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libjack-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libxinerama-dev \
            libxxf86vm-dev \
            libxss-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libdecor-0-dev \
            liburing-dev \
            libsndio-dev \
            libdbus-1-dev \
            libvulkan-dev \
            libxkbcommon-dev \
            libibus-1.0-dev \
            libusb-1.0-0-dev \
            libxtst-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpng-dev \
            libwebp-dev \
            libtiff-dev \
            libjpeg-dev \
            libidn2-dev \
            libnghttp2-dev \
            libbrotli-dev \
            libzstd-dev \
            zlib1g-dev \
            xvfb \
            libvorbis-dev \
            libtheora-dev \
            libopusfile-dev \
            libflac-dev \
            libgtk-3-dev \
            pandoc \
            libcurl4-openssl-dev \
            libenet-dev \
            pulseaudio \
            libopenal-dev \
            libglu-dev \
            libopenmpt-dev \
            ninja-build

    - name: Setup macOS Environment
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install \
            zstd \
            brotli \
            nghttp2 \
            libpsl \
            freetype \
            harfbuzz \
            libpng \
            webp \
            libtiff \
            libidn2 \
            jpeg \
            ninja

# CMake config

    - name: Configure Release (GCC/MACOS)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

    - name: Configure Release (MSVC / MINGW)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        EXTRA_ARGS=""
        VCPKG_ROOT_DIR="${VCPKG_INSTALLATION_ROOT:-C:/vcpkg}"
        VCPKG_CMAKE="$VCPKG_ROOT_DIR/scripts/buildsystems/vcpkg.cmake"

        if [ -f "$VCPKG_CMAKE" ]; then
          EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$VCPKG_CMAKE -DVCPKG_TARGET_TRIPLET=x64-windows-static"
          echo "Enabled VCPKG correctly"
        else
          echo "No VCPKG config found!"
        fi

        cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release $EXTRA_ARGS
        
    - name: Build
      shell: bash
      run: cmake --build build --parallel 4 --config Release
